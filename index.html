<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLB 模型展示</title>
    <style>
        /* 全局重置 */
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: Arial, sans-serif; }

        /* 加载遮罩层 - 居中显示进度 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            transition: opacity 0.6s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-text {
            font-size: 18px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        /* 进度条外框 */
        #progress-bar-bg {
            width: 260px;
            max-width: 80vw;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        /* 进度条填充 */
        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border-radius: 4px;
            transition: width 0.2s ease;
        }
        #progress-percent {
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
        }

        /* 底部提示 */
        #info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }
        /* 自动旋转开关（小按钮） */
        #autoRotateBtn {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        #autoRotateBtn:hover { background: rgba(255,255,255,0.25); }
        #autoRotateBtn:active { background: rgba(255,255,255,0.35); }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loading-overlay">
        <div id="loading-text">⏳ 加载模型中</div>
        <div id="progress-bar-bg">
            <div id="progress-bar-fill" style="width:0%;"></div>
        </div>
        <div id="progress-percent">0%</div>
    </div>

    <div id="info">🖱️ 拖动旋转 · 滚轮缩放 · 手机触摸支持</div>
    <button id="autoRotateBtn">⟳ 自动旋转</button>

    <!-- 使用 Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- DOM 引用 -----
        const overlay = document.getElementById('loading-overlay');
        const fill = document.getElementById('progress-bar-fill');
        const percentText = document.getElementById('progress-percent');
        const autoRotateBtn = document.getElementById('autoRotateBtn');

        // ----- 场景、相机、渲染器 -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制过高pixel ratio以提升性能
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ----- 控制器（默认支持触摸）-----
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 2.0;
        controls.target.set(0, 0, 0);
        controls.update();

        // ----- 灯光 -----
        const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xffccaa, 1.0);
        backLight.position.set(-5, 0, 5);
        scene.add(backLight);

        // ----- 加载 GLB -----
        const loader = new GLTFLoader();

        loader.load(
            './1.glb',
            (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // 自动适配相机
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const dist = maxDim / (2 * Math.tan(Math.PI * 45 / 360));
                camera.position.set(center.x, center.y + maxDim * 0.3, center.z + dist * 1.5);
                controls.target.copy(center);
                controls.update();

                // 隐藏加载遮罩（淡出）
                overlay.classList.add('hidden');
                // 一段时间后完全隐藏（避免遮挡点击）
                setTimeout(() => { overlay.style.display = 'none'; }, 800);

                console.log('✅ 模型加载成功！');
            },
            (xhr) => {
                // 更新进度
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                fill.style.width = percent + '%';
                percentText.textContent = percent + '%';
                // 如果进度达到100%但还未完成解析，可显示“解析中”
                if (percent === 100) {
                    document.getElementById('loading-text').textContent = '🔄 解析模型中...';
                }
            },
            (error) => {
                overlay.innerHTML = `
                    <div style="color:#ff6b6b; font-size:20px;">❌ 加载失败</div>
                    <div style="margin-top:12px; color:#aaa; font-size:14px;">请检查 1.glb 是否在正确位置</div>
                    <div style="margin-top:8px; color:#888; font-size:12px;">${error.message || ''}</div>
                `;
                console.error('加载错误:', error);
            }
        );

        // ----- 自动旋转按钮切换 -----
        autoRotateBtn.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
            autoRotateBtn.textContent = controls.autoRotate ? '⏸ 停止旋转' : '⟳ 自动旋转';
        });

        // ----- 窗口自适应 -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- 动画循环 -----
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 启用 autoRotate 时会自动旋转
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
