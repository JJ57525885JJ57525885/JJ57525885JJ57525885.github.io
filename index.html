<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>搜索中转站</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 蓝色渐变背景 */
            background: linear-gradient(145deg, #1a6bc4 0%, #0d47a1 50%, #073178 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 30px 20px 40px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }
        .brand-icon {
            font-size: 32px;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }
        .brand-text {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
        }
        .brand-text span {
            font-weight: 300;
            opacity: 0.7;
        }

        .search-wrapper {
            width: 100%;
            max-width: 560px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 60px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.20),
                        0 2px 8px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            padding: 4px 4px 4px 22px;
        }
        .search-box:focus-within {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.30),
                        0 0 0 4px rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .search-box .search-icon {
            flex-shrink: 0;
            color: #7a8ba3;
            font-size: 18px;
            line-height: 1;
            margin-right: 10px;
            opacity: 0.6;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 14px 0;
            color: #1e2a3a;
            font-weight: 400;
            min-width: 0;
        }
        .search-box input::placeholder {
            color: #b0c0d0;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .search-box .search-btn {
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a6bc4, #0d47a1);
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(13, 71, 161, 0.35);
            white-space: nowrap;
        }
        .search-box .search-btn:hover {
            background: linear-gradient(135deg, #1f7ad4, #0f5bb5);
            box-shadow: 0 6px 20px rgba(13, 71, 161, 0.50);
            transform: translateY(-1px);
        }
        .search-box .search-btn:active {
            transform: scale(0.96);
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            width: 100%;
            margin-top: 6px;
            min-height: 220px;
            position: relative;
        }

        .card {
            flex: 0 0 180px;
            max-width: 200px;
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 16px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s ease,
                        opacity 0.3s ease,
                        visibility 0.3s ease;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.15),
                        0 2px 6px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.92);
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.25),
                        0 4px 12px rgba(0, 0, 0, 0.08);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .card:active {
            transform: translateY(-4px) scale(0.97);
            transition-duration: 0.08s;
        }

        .card.hidden {
            display: none;
        }

        .card .image-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 14px;
            border-radius: 20px;
            overflow: hidden;
            background: #ecf3fa;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: background 0.3s ease;
        }
        .card:hover .image-wrapper {
            background: #e3edf7;
        }

        .card .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .card:hover .image-wrapper img {
            transform: scale(1.04);
        }

        .card .card-name {
            font-size: 20px;
            font-weight: 700;
            color: #0d2b4e;
            letter-spacing: 1px;
            transition: color 0.25s ease;
        }
        .card:hover .card-name {
            color: #1a6bc4;
        }

        .card .card-sub {
            font-size: 13px;
            color: #8a9bb0;
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .no-result {
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            padding: 30px 10px;
            text-align: center;
            width: 100%;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }
        .no-result span {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        .no-result.hidden {
            display: none;
        }

        .hint {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.5px;
            margin-top: 4px;
            font-weight: 300;
            text-align: center;
        }
        .hint strong {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px 30px;
                gap: 30px;
                border-radius: 32px;
            }
            .brand-text {
                font-size: 20px;
            }
            .brand-icon {
                font-size: 26px;
            }
            .search-box {
                padding: 4px 4px 4px 16px;
                border-radius: 40px;
            }
            .search-box input {
                font-size: 14px;
                padding: 12px 0;
            }
            .search-box .search-btn {
                padding: 10px 18px;
                font-size: 13px;
            }
            .search-box .search-icon {
                font-size: 15px;
                margin-right: 6px;
            }
            .cards {
                gap: 20px;
            }
            .card {
                flex: 0 0 150px;
                padding: 18px 12px 16px;
                border-radius: 22px;
            }
            .card .image-wrapper {
                width: 100px;
                height: 100px;
                border-radius: 16px;
            }
            .card .card-name {
                font-size: 17px;
            }
            .card .card-sub {
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .card {
                flex: 0 0 130px;
                padding: 14px 10px 12px;
            }
            .card .image-wrapper {
                width: 80px;
                height: 80px;
            }
            .card .card-name {
                font-size: 15px;
            }
            .search-box .search-btn {
                padding: 8px 14px;
                font-size: 12px;
            }
            .search-box input {
                font-size: 13px;
                padding: 10px 0;
            }
        }

        .card {
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(26, 107, 196, 0.12) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            border-radius: inherit;
        }
        .card:active::after {
            opacity: 1;
            transition-duration: 0.05s;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="brand">
            <span class="brand-icon">🔍</span>
            <span class="brand-text">搜索<span>中转站</span></span>
        </div>

        <div class="search-wrapper">
            <form class="search-box" id="searchForm" onsubmit="return false;">
                <span class="search-icon">🔎</span>
                <input
                type="text"
                id="searchInput"
                placeholder="输入“蚁”或“后”显示蚁后，输入“独”或“仙”显示独角仙"
                autocomplete="off"
                />
                <button type="button" class="search-btn" id="searchBtn">搜索</button>
            </form>
        </div>

        <div class="cards" id="cardsContainer">

            <!-- 蚁后卡片 → 1.html -->
            <a href="1.html" class="card" id="cardAnt">
                <div class="image-wrapper">
                    <img src="2.png" alt="蚁后" loading="lazy" />
                </div>
                <div class="card-name">🐜 蚁后</div>
                <div class="card-sub">女王 · 族群核心</div>
            </a>

            <!-- 独角仙卡片 → 2.html -->
            <a href="2.html" class="card" id="cardBeetle">
                <div class="image-wrapper">
                    <img src="3.png" alt="独角仙" loading="lazy" />
                </div>
                <div class="card-name">🪲 独角仙</div>
                <div class="card-sub">甲虫 · 大力神</div>
            </a>

            <!-- 无结果占位 -->
            <div class="no-result hidden" id="noResult">
                <span>😅</span> 没有找到与 “<span id="keywordDisplay"></span>” 匹配的卡片
            </div>

        </div>

        <div class="hint">
            💡 搜索只匹配卡片名称，点击卡片跳转 <strong>1.html</strong> 或 <strong>2.html</strong>
        </div>

    </div>

    <script>
        (function() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const cardAnt = document.getElementById('cardAnt');
            const cardBeetle = document.getElementById('cardBeetle');
            const noResult = document.getElementById('noResult');
            const keywordDisplay = document.getElementById('keywordDisplay');

            const cards = [cardAnt, cardBeetle];

            function filterCards() {
                const keyword = searchInput.value.trim();
                const lowerKeyword = keyword.toLowerCase();

                if (keyword === '') {
                    cards.forEach(card => card.classList.remove('hidden'));
                    noResult.classList.add('hidden');
                    return;
                }

                let foundMatch = false;

                cards.forEach(card => {
                    // 只取卡片名称（.card-name）进行匹配，忽略描述
                    const nameEl = card.querySelector('.card-name');
                    const cardName = nameEl ? nameEl.textContent.toLowerCase() : '';
                    if (cardName.includes(lowerKeyword)) {
                        card.classList.remove('hidden');
                        foundMatch = true;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                if (foundMatch) {
                    noResult.classList.add('hidden');
                } else {
                    keywordDisplay.textContent = keyword;
                    noResult.classList.remove('hidden');
                }
            }

            searchInput.addEventListener('input', filterCards);
            searchBtn.addEventListener('click', filterCards);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    filterCards();
                }
            });

            // 初始化
            filterCards();

            console.log('✅ 搜索中转站 (仅匹配卡片名称)');
        })();
    </script>

</body>
</html>
